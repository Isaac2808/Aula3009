<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto de Flor | Editar Produto</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#fff8f8;}
header{background:white;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.logo{font-size:32px;font-weight:bold;color:#d48b9b;}
.top-menu{display:flex;gap:15px;}
.top-menu a{text-decoration:none;color:#666;font-weight:bold;}
.container{max-width:900px;margin:40px auto;padding:30px;background:white;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);}
h1{color:#d48b9b;margin-bottom:25px;}
.form-group{display:flex;flex-direction:column;margin-bottom:20px;}
label{margin-bottom:8px;font-weight:bold;color:#666;}
input,textarea,select{padding:14px;border:1px solid #ddd;border-radius:12px;}
textarea{height:120px;resize:none;}
.preview{width:200px;height:200px;object-fit:cover;border-radius:12px;border:2px dashed #d48b9b;margin-top:15px;}
.btn-salvar{margin-top:20px;background:#d48b9b;border:none;color:white;padding:15px;border-radius:12px;cursor:pointer;font-weight:bold;}
.btn-salvar:hover{background:#c47d8d;}
</style>
</head>
<body>

<header>
    <div class="logo">🌸 Ponto de Flor</div>
    <div class="top-menu">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'c_produto' %}">Produtos</a>
        <a href="{% url 'ver_carrinho' %}">Carrinho</a>
        <a href="{% url 'logout' %}">Sair</a>
    </div>
</header>

<div class="container">
    <h1>✏️ Editar Produto</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ produto.nome }}" required>
        </div>
        <div class="form-group">
            <label>Categoria</label>
            <select name="categoria">
                <option value="Vestidos" {% if produto.categoria == "Vestidos" %}selected{% endif %}>Vestidos</option>
                <option value="Ternos" {% if produto.categoria == "Ternos" %}selected{% endif %}>Ternos</option>
                <option value="Chapeu" {% if produto.categoria == "Chapeu" %}selected{% endif %}>Chapeu</option>
                <option value="Encomendas" {% if produto.categoria == "Encomendas" %}selected{% endif %}>Encomendas</option>
            </select>
        </div>
        <div class="form-group">
            <label>Preço</label>
            <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
        </div>
        <div class="form-group">
            <label>Estoque</label>
            <input type="number" name="quantidade" value="{{ produto.quantidade }}" required>
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <textarea name="descricao">{{ produto.descricao }}</textarea>
        </div>
        <div class="form-group">
            <label>Imagem Atual</label><br>
            {% if produto.imagem %}
                <img src="{{ produto.imagem.url }}" class="preview" alt="{{ produto.nome }}">
            {% else %}
                <p style="color:#666;">Nenhuma imagem cadastrada.</p>
            {% endif %}
        </div>
        <div class="form-group">
            <label>Nova Imagem (opcional)</label>
            <input type="file" name="imagem" accept="image/*">
        </div>
        <button type="submit" class="btn-salvar">💾 Salvar Alterações</button>
    </form>
</div>

</body>
</html>
